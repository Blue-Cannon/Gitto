# .github/dependabot.yml - Optimized for PHP / Composer
# Place this at: .github/dependabot.yml

version: 2
updates:
  # 1. PHP Dependencies - Composer (main)
    - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 10
    labels:
            - "dependencies"
            - "php"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Group minor/patch updates to reduce PR noise
    groups:
      production-deps:
        patterns:
                    - "*"
        update-types:
                    - "minor"
                    - "patch"
      dev-deps:
        patterns:
                    - "*"
        dependency-type: "indirect"
        update-types:
                    - "minor"
                    - "patch"

  # 2. GitHub Actions (always recommended)
    - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
            - "dependencies"
            - "github-actions"
    commit-message:
      prefix: "ci"

  # 3. Docker (if you use Dockerfile)
    - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
            - "dependencies"
            - "docker"
